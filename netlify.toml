# netlify.toml — SPA fallback redirect rules for React Router v6.
# If you deploy the frontend to Netlify, this ensures that all
# non-file paths are served the index.html so React Router can
# handle client-side routing.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force HTTPS and security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
